name: Built on Ubuntu using Conda

on: [push]

jobs:
  build-linux-conda:
    name: Build Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
    - uses: actions/checkout@v4
    - name: Set up conda
      uses: conda-incubator/setup-miniconda@v3
    - name: Build
      shell: bash -el {0}
      run: |
        PYTHON_VERSION=${{ matrix.python-version }} make build
    - name: Clean
      shell: bash -el {0}
      run: |
        make clean
