name: Ruff

on: [push]

jobs:
  build-linux-conda:
    runs-on: ubuntu-latest
    strategy:
      max-parallel: 5

    steps:
    - uses: actions/checkout@v4
    - name: Set up Python 3.12
      uses: actions/setup-python@v3
      with:
        python-version: '3.12'
    - name: Set up conda
      uses: conda-incubator/setup-miniconda@v3
    - name: Build
      shell: bash -el {0}
      run: |
        make build
    - name: Ruff
      shell: bash -el {0}
      run: |
        make check
    - name: Clean
      shell: bash -el {0}
      run: |
        make clean